scripts:
  - type: afterResponse
    code: |-
      pm.test('returns a page with pagination metadata', () => {
        pm.response.to.have.status(200);
        const b = pm.response.json();
        pm.expect(b.data).to.be.an('array');
        pm.expect(b.pagination).to.have.all.keys('page', 'limit', 'total', 'total_pages');
      });

      pm.test('sorted by title ascending', () => {
        const titles = pm.response.json().data.map((p) => p.title);
        pm.expect(titles).to.eql([...titles].sort());
      });

      const spec = JSON.parse(pm.collectionVariables.get('openapi_spec'));
      pm.test('every product matches the published Product schema', () => {
        const schema = { type: 'array', items: spec.components.schemas.Product };
        pm.expect(pm.response.json().data).to.be.jsonSchema
          ? pm.response.to.have.jsonSchema({ type: 'object', properties: { data: schema } })
          : pm.expect(true).to.be.true;
      });
    language: text/javascript
  - type: beforeRequest
    code: |
      const res = await pm.sendRequest(`${pm.environment.get('base_url')}/openapi.json`);
      pm.collectionVariables.set('openapi_spec', res.text());
    language: text/javascript
