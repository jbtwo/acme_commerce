scripts:
  - type: afterResponse
    code: |-
      pm.test('returns a page with pagination metadata', () => {
        pm.response.to.have.status(200);
        const b = pm.response.json();
        pm.expect(b.data).to.be.an('array');
        pm.expect(b.pagination).to.have.all.keys('page', 'limit', 'total', 'total_pages');
      });

      pm.test('sorted by title ascending', () => {
        const titles = pm.response.json().data.map((p) => p.title);
        pm.expect(titles).to.eql([...titles].sort());
      });
