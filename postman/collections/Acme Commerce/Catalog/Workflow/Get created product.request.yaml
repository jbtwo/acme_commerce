$kind: http-request
name: Get created product
url: "{{base_url}}/api/v1/products/{{product_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('chain resolved to the product we created', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.id).to.eql(pm.collectionVariables.get('product_id'));
      });
    language: text/javascript
order: 1175167201619549
