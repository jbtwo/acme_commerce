        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed (`VALIDATION_ERROR` or `MALFORMED_ID`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks the required permission.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No such reservation (`RESERVATION_NOT_FOUND`).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected server error.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The database is unreachable. Safe to retry.
      security:
        - bearerAuth: []
      summary: Retrieve a reservation
      tags:
        - Inventory
  /api/v1/inventory/reservations/{reservationId}/release:
    post:
      description: |-
        Returns held stock to available and marks the reservation `released`.

        **Idempotent.** Releasing an already-released reservation returns `200` with it
        unchanged, for the same reason archiving a product twice does: "make sure this is
        released" is a reasonable thing to say twice, especially after a network timeout.

        Releasing an **expired** reservation is different and returns `409` — its stock was
        already reclaimed, so succeeding silently would let you believe you had returned
        stock you had not.
      operationId: releaseInventoryReservation
      parameters:
        - description: Reservation identifier as returned by the API.
          in: path
          name: reservationId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
          description: The released reservation. Returned for a repeat call too.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed (`VALIDATION_ERROR` or `MALFORMED_ID`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks the required permission.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No such reservation (`RESERVATION_NOT_FOUND`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The reservation had already expired (`RESERVATION_NOT_ACTIVE`).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected server error.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The database is unreachable. Safe to retry.
      security:
        - bearerAuth: []
      summary: Release a reservation
      tags:
        - Inventory
  /api/v1/inventory/{sku}:
    get:
      description: |-
        Stock for a single SKU across every location, with network-wide totals.

        **The path parameter is a SKU, not an opaque id** — the one place in this API where a
        human-meaningful natural key sits in a path, because that is how people refer to
        inventory. The tradeoff: renaming a SKU changes the URL, which an opaque id would
        have insulated you from.

        A location with no stock row for this SKU is absent from `locations` rather than
        reported as zero. Never stocked there and stocked-but-empty are different facts.
      operationId: getInventoryForSku
      parameters:
        - description: Stock-keeping unit. Note this is a natural key, not an opaque id.
          in: path
