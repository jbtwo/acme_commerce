          in: header
          name: x-request-id
          required: false
          schema:
            pattern: ^[A-Za-z0-9_-]{1,128}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
          description: The archived product. Returned for a repeat call too.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed. `error.code` is VALIDATION_ERROR, MALFORMED_ID, or INVALID_JSON.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks `catalog:write` (`INSUFFICIENT_PERMISSION`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No product exists with that identifier (`PRODUCT_NOT_FOUND`).
        "500":
