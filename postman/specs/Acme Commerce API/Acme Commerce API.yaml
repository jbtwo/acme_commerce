            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed (`VALIDATION_ERROR` or `MALFORMED_ID`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks the required permission.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Either no such SKU exists in the catalog (`VARIANT_NOT_FOUND`) or it exists but is not inventory-tracked (`INVENTORY_ITEM_NOT_FOUND`). Deliberately distinct — they need different fixes.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected server error.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The database is unreachable. Safe to retry.
      security:
        - bearerAuth: []
      summary: Retrieve availability for one SKU
      tags:
        - Inventory
  /api/v1/locations:
    get:
      description: |-
        Paginated, filterable list of the places inventory is held.

        With no `is_active` filter, both active and retired locations are returned — the same
        no-hidden-filter rule as the catalog. The result set is fully determined by the query
        string.

        Requires the `locations:read` permission, which every role has.
      operationId: listLocations
      parameters:
        - description: One-based page number.
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
        - description: Records per page, max 100.
          in: query
          name: limit
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
        - description: Kind of location. `warehouse` fulfils orders, `retail` is a physical store, `virtual` covers dropship and in-transit stock that has no address.
          in: query
          name: type
          required: false
          schema:
            enum:
              - warehouse
              - retail
              - virtual
            type: string
        - description: Filter by active state. Omit to return locations of both states.
          in: query
          name: is_active
          required: false
          schema:
            type: boolean
        - description: Case-insensitive substring match on name and city.
          in: query
          name: q
          required: false
          schema:
            maxLength: 100
            minLength: 1
            type: string
        - description: Sort field. Allowlisted; `id` is appended as a stable tiebreaker.
          in: query
          name: sort
          required: false
          schema:
            default: name
            enum:
              - name
              - type
              - created_at
              - updated_at
            type: string
        - description: Sort direction.
          in: query
          name: order
          required: false
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"
          description: A page of locations.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed (`VALIDATION_ERROR`, `MALFORMED_ID`, or `INVALID_JSON`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks the required permission (`INSUFFICIENT_PERMISSION`).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected server error.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The database is unreachable. Safe to retry.
      security:
        - bearerAuth: []
      summary: List inventory locations
      tags:
        - Locations
    post:
      description: |-
        Creates a location. Names are unique case-insensitively; a duplicate returns `409`.

        Requires `locations:write`. The `support` role does not have it — logging in as
        support and calling this is the shortest way to see a `403` that names the permission
        it wanted.
      operationId: createLocation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
          description: The location that was created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed (`VALIDATION_ERROR`, `MALFORMED_ID`, or `INVALID_JSON`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks the required permission (`INSUFFICIENT_PERMISSION`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: A location with that name already exists (`LOCATION_NAME_EXISTS`).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected server error.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The database is unreachable. Safe to retry.
      security:
        - bearerAuth: []
      summary: Create an inventory location
      tags:
        - Locations
  /api/v1/locations/{locationId}:
    get:
      description: Returns one location. A syntactically invalid id returns `400 MALFORMED_ID`; a well-formed id naming nothing returns `404`.
      operationId: getLocation
      parameters:
        - description: Location identifier as returned by the API.
          in: path
          name: locationId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
          description: The requested location.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed (`VALIDATION_ERROR`, `MALFORMED_ID`, or `INVALID_JSON`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks the required permission (`INSUFFICIENT_PERMISSION`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No location exists with that identifier (`LOCATION_NOT_FOUND`).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected server error.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The database is unreachable. Safe to retry.
      security:
        - bearerAuth: []
      summary: Retrieve a location
      tags:
        - Locations
    patch:
      description: |-
        Updates only the properties present in the body. Omitted properties are unchanged; an
        explicit `null` clears a nullable one.

        **There is no DELETE.** A location is referenced by inventory levels and by the
        adjustment audit log, so removing one would orphan history that has to stay
        answerable. Retire a location with `{"is_active": false}` instead — which is what
        "delete this warehouse" actually means in a business that has shipped from it.
      operationId: updateLocation
      parameters:
        - description: Location identifier as returned by the API.
          in: path
          name: locationId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
          description: The location after the update.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed (`VALIDATION_ERROR`, `MALFORMED_ID`, or `INVALID_JSON`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks the required permission (`INSUFFICIENT_PERMISSION`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No location exists with that identifier (`LOCATION_NOT_FOUND`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Another location already uses that name (`LOCATION_NAME_EXISTS`).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected server error.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The database is unreachable. Safe to retry.
      security:
        - bearerAuth: []
      summary: Partially update a location
      tags:
        - Locations
  /api/v1/pricing/{sku}:
    get:
      description: |-
        Returns the price **and the derivation**, not just a number.

        The response lists every rule considered, in the order applied, with the amount each
        contributed — and the ones that did **not** apply, with the reason. That last part is
        the difference between an API a support engineer can answer a question with and one
        that produces a figure nobody can explain.

        **Order and compounding.** Rules apply in ascending `priority`, each against the
        running subtotal rather than the base price. Two 10% discounts therefore compound to
        19%, not 20%. A business decision, stated rather than implied.

        **Rounding.** Each step rounds to a whole minor unit, half away from zero. Each
        reported `amount_cents` is defined as the difference between the subtotal before and
        after, so the adjustments always sum exactly to `effective_unit_price_cents`.

        Requires `pricing:read` because `?customer_id=` returns customer-specific pricing, and
        commercial terms are not public.
      operationId: getEffectivePrice
      parameters:
        - description: "Unlocks customer-group pricing. Until the Customer API arrives in Milestone 3 the group mapping is fixture data: `customer_wholesale_001`, `customer_edu_001`, `customer_retail_001`."
          example: customer_wholesale_001
          in: query
          name: customer_id
          required: false
          schema:
            maxLength: 64
            type: string
        - description: Unlocks partner-specific pricing. No partner rules are seeded yet.
          in: query
          name: partner_id
          required: false
          schema:
            maxLength: 64
            type: string
        - description: Units. Drives quantity-break rules.
          in: query
          name: quantity
          required: false
          schema:
            default: 1
            maximum: 1000000
            minimum: 1
            type: integer
        - description: Assert the currency you expect. Mismatching the price's own currency returns 404 rather than converting — a wrong exchange rate silently applied is worse than a refusal.
          in: query
          name: currency
          required: false
          schema:
            pattern: ^[A-Z]{3}$
            type: string
        - description: Stock-keeping unit to price.
          in: path
          name: sku
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceQuoteResponse"
          description: The effective price and its full derivation.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request is malformed (`VALIDATION_ERROR`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing, malformed, invalid, or expired bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated, but your role lacks `pricing:read`.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No such SKU (`VARIANT_NOT_FOUND`), or no price in the currency you asked for (`PRICING_UNAVAILABLE`).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected server error.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The database is unreachable. Safe to retry.
      security:
        - bearerAuth: []
      summary: Calculate the effective price for a SKU
      tags:
        - Pricing
  /api/v1/products:
    get:
      description: |-
        Returns a page of products with pagination metadata.

        **No implicit filtering.** With no `status` parameter, products of every status are
        returned, archived ones included. This API applies no hidden default filter: the result
        set is fully determined by the query string. Most catalog APIs hide archived records;
        this one does not, so that DELETE is observable as a state change rather than as a
        disappearance.

        Filters combine with AND. An empty result is `200` with `"data": []`, never `404` —
        an empty collection is a successful answer to a well-formed question. A page past the
        end is also `200` with an empty array.

        **Unknown query parameters are rejected with 400**, not ignored. `?statuss=active`
        silently returning every product is a worse outcome than a loud error.

        Ordering always ends with `id` as a tiebreaker, so paging through a sorted list cannot
        show the same record twice.

        Every response carries an `X-Request-Id` header.
      operationId: listProducts
      parameters:
        - description: One-based page number. Requesting a page past the end returns an empty `data` array with 200, not 404.
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
        - description: Records per page. Default 25, maximum 100. A larger value is rejected with 400 rather than silently clamped, so a client asking for 1000 learns that it cannot have 1000.
          in: query
          name: limit
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
        - description: "Filter by publication state. NOTE: with no `status` filter, products of ALL statuses are returned, archived included. This API applies no hidden default filter — the result set is fully determined by the query string."
          in: query
          name: status
          required: false
          schema:
            enum:
              - draft
              - active
              - archived
            type: string
        - description: Filter by vendor. Case-insensitive EXACT match, not a prefix or substring.
          example: Acme
          in: query
          name: vendor
          required: false
          schema:
            maxLength: 100
            minLength: 1
            type: string
        - description: Filter by product type. Case-insensitive exact match.
          example: Backpacks
          in: query
          name: product_type
          required: false
          schema:
            maxLength: 100
            minLength: 1
            type: string
        - description: Filter to products carrying this tag. Case-sensitive exact match on an array element. One tag per request in this version.
          example: bestseller
          in: query
          name: tag
          required: false
          schema:
            maxLength: 50
            minLength: 1
            type: string
        - description: Case-insensitive substring search across `title`, `description`, and `vendor`. Does not search variant SKUs. Combines with the filters using AND.
          example: backpack
          in: query
          name: q
          required: false
          schema:
            maxLength: 200
            minLength: 1
            type: string
        - description: Field to sort by. Restricted to this allowlist; any other value returns 400 with the permitted values in `error.details.allowed`. `id` is always appended as a tiebreaker so paging is stable across requests.
          in: query
          name: sort
          required: false
          schema:
            default: created_at
            enum:
              - created_at
              - updated_at
              - title
              - vendor
              - product_type
              - status
            type: string
        - description: Sort direction. Applies to the tiebreaker too.
          in: query
          name: order
          required: false
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: Optional caller-supplied correlation id, echoed back in the X-Request-Id response header and included in structured errors. When absent or not matching this pattern, the server generates one. Supplying your own lets you correlate a request across your system and ours.
          example: my-app-checkout-attempt-42
          in: header
          name: x-request-id
          required: false
          schema:
            pattern: ^[A-Za-z0-9_-]{1,128}$
            type: string
