      description: |-
        Returns one product by identifier.

        Two different failures are deliberately distinguished. A syntactically invalid id
        such as `prod_undefined` returns `400 MALFORMED_ID`, because that is a client bug.
        A well-formed id that names nothing returns `404 PRODUCT_NOT_FOUND`. Collapsing both
        into 404 — as many APIs do — leaves the caller unable to tell a broken string
        interpolation from a deleted record.
      operationId: getProduct
      parameters:
        - description: Product identifier as returned by the API.
          example: prod_7ebf51270d4d3de9f7acad4c
          in: path
          name: productId
          required: true
          schema:
            type: string
        - description: Optional caller-supplied correlation id, echoed back in the X-Request-Id response header and included in structured errors. When absent or not matching this pattern, the server generates one. Supplying your own lets you correlate a request across your system and ours.
          example: my-app-checkout-attempt-42
